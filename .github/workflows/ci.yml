name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-companion:
    name: Windows Companion tests and installer
    if: github.event.repository.visibility == 'public'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-pc-windows-msvc
          components: rustfmt
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Build pinned zsign sidecar
        shell: pwsh
        run: ./scripts/build-zsign-windows.ps1
      - run: cargo fmt --check --manifest-path apps/windows-companion/src-tauri/Cargo.toml
      - run: cargo test --manifest-path apps/windows-companion/src-tauri/Cargo.toml
      - run: cargo check --manifest-path apps/windows-companion/src-tauri/Cargo.toml
      - name: Install RustSec cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependency advisories
        run: cargo audit --file apps/windows-companion/src-tauri/Cargo.lock
      - run: npm run build --workspace @dreyzestore/windows-companion
      - name: Build unsigned Windows installers
        run: npm run tauri --workspace @dreyzestore/windows-companion -- build --bundles nsis,msi
      - name: Write installer SHA-256 manifest
        shell: pwsh
        run: |
          $bundle = Resolve-Path 'apps/windows-companion/src-tauri/target/release/bundle'
          $manifest = Join-Path $bundle 'SHA256SUMS.txt'
          Remove-Item -LiteralPath $manifest -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' } | ForEach-Object {
            $relative = [System.IO.Path]::GetRelativePath($bundle, $_.FullName).Replace('\', '/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -LiteralPath $manifest -Value "$hash *$relative" -Encoding ascii
          }
          if (-not (Test-Path -LiteralPath $manifest) -or (Get-Item -LiteralPath $manifest).Length -eq 0) { throw 'No NSIS EXE/MSI installers were found to hash.' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DreyzeStoreCompanion-windows-x64
          path: apps/windows-companion/src-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend and shared contracts
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck --workspace @dreyzestore/shared
      - run: npm run typecheck --workspace @dreyzestore/api
      - run: npm test
      - run: npm run validator:test
      - run: python scripts/validate_migrations.py
      - run: npm run build --workspace @dreyzestore/api

  admin:
    name: Admin panel
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace @dreyzestore/admin
      - run: npm run test --workspace @dreyzestore/admin
      - run: npm run build --workspace @dreyzestore/admin

  ios:
    name: iOS tests and unsigned RC artifacts
    if: github.event.repository.visibility == 'public'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          simulator_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); devices=[d for runtime in data["devices"].values() for d in runtime if d["isAvailable"] and d["name"].startswith("iPhone")]; print(devices[0]["udid"] if devices else "")')"
          if [[ -z "$simulator_id" ]]; then
            echo "No available iPhone simulator was found on this runner." >&2
            exit 1
          fi
          echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"
      - name: Resolve Xcode package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/DreyzeStore/DreyzeStore.xcodeproj -scheme DreyzeStore
      - name: Build and test
        run: >-
          xcodebuild test
          -project ios/DreyzeStore/DreyzeStore.xcodeproj
          -scheme DreyzeStore
          -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }},arch=${{ steps.simulator.outputs.arch }}"
          ARCHS=${{ steps.simulator.outputs.arch }}
          ONLY_ACTIVE_ARCH=YES
          CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone app bundle
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/dreyzestore-ios-rc"
          derived_dir="$RUNNER_TEMP/dreyzestore-ios-derived"
          mkdir -p "$artifact_dir"
          xcodebuild build \
            -project ios/DreyzeStore/DreyzeStore.xcodeproj \
            -scheme DreyzeStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_dir" \
            CODE_SIGNING_ALLOWED=NO
          app_path="$derived_dir/Build/Products/Release-iphoneos/DreyzeStore.app"
          test -d "$app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$artifact_dir/DreyzeStore-iOS-unsigned-app.zip"
          device_test_derived="$RUNNER_TEMP/dreyzestore-device-test-derived"
          xcodebuild build \
            -project ios/DreyzeStore/DreyzeStore.xcodeproj \
            -scheme DreyzeStore \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$device_test_derived" \
            PRODUCT_BUNDLE_IDENTIFIER=org.dreyzestore.test.store \
            INFOPLIST_KEY_CFBundleDisplayName='DreyzeStore RC' \
            CODE_SIGNING_ALLOWED=NO
          device_test_app="$device_test_derived/Build/Products/Release-iphoneos/DreyzeStore.app"
          bash scripts/package-dreyzestore-device-test-ipa.sh "$device_test_app" "$artifact_dir/DreyzeStore-RC-device-test.ipa"
          bash scripts/package-device-test-ipa.sh "$artifact_dir/device-test" "$RUNNER_TEMP/dreyze-device-test-derived"
          mv "$artifact_dir/device-test/DreyzeDeviceTest-sample.ipa" "$artifact_dir/DreyzeDeviceTest-sample.ipa"
          rmdir "$artifact_dir/device-test"
          cd "$artifact_dir"
          shasum -a 256 DreyzeStore-iOS-unsigned-app.zip DreyzeDeviceTest-sample.ipa DreyzeStore-RC-device-test.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DreyzeStore-iOS-0.9.0-rc.1
          path: ${{ runner.temp }}/dreyzestore-ios-rc/**
          if-no-files-found: error
          retention-days: 30
